<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameHub - Discover Your Next Adventure</title>

  <!-- Font (Inter) and icons (Font Awesome) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Our styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="has-bottom-nav">

  <!-- ================= NAVBAR ================= -->
  <header class="navbar">
    <div class="navbar-inner">
      <button class="menu-btn" id="menuBtn" aria-label="Open menu">
        <i class="fa-solid fa-bars"></i>
      </button>

      <a href="index.html" class="logo">
        <span class="logo-icon"><i class="fa-solid fa-gamepad"></i></span>
        GameHub
      </a>

      <nav class="navbar-links" id="navbarLinks">
        <a href="index.html" class="active">Home</a>
        <a href="games.html">Games</a>
        <a href="#">News</a>
        <a href="#">Reviews</a>
      </nav>

      <div class="navbar-right">
        <form class="search-box" action="search.html" method="get">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" name="q" placeholder="Search games...">
        </form>
        <a href="search.html" class="icon-btn mobile-search" aria-label="Search">
          <i class="fa-solid fa-magnifying-glass"></i>
        </a>
        <button class="icon-btn" aria-label="Notifications">
          <i class="fa-regular fa-bell"></i>
        </button>
        <a href="login.html" class="avatar" aria-label="Account">
          <i class="fa-solid fa-user"></i>
        </a>
      </div>
    </div>
  </header>


  <!-- ================= HERO SLIDER ================= -->
  <section class="hero">
    <!-- home.js adds the slide images and the dots -->
    <div class="hero-slides" id="heroSlides"></div>
    <div class="hero-overlay"></div>

    <button class="hero-arrow hero-arrow-left" id="heroPrev" aria-label="Previous slide">
      <i class="fa-solid fa-chevron-left"></i>
    </button>

    <div class="hero-content">
      <h1>Discover Your<br>Next Adventure</h1>
      <p>Explore the biggest games, latest releases and find your next favorite game.</p>
      <a href="games.html" class="btn btn-primary">Browse Games <i class="fa-solid fa-arrow-right"></i></a>
    </div>

    <button class="hero-arrow hero-arrow-right" id="heroNext" aria-label="Next slide">
      <i class="fa-solid fa-chevron-right"></i>
    </button>

    <div class="hero-dots" id="heroDots"></div>
  </section>


  <main class="container">

    <!-- ================= POPULAR GAMES ================= -->
    <section class="section">
      <div class="section-header">
        <h2>Popular Right Now</h2>
        <a href="games.html" class="text-link">View All <i class="fa-solid fa-arrow-right"></i></a>
      </div>

      <!-- home.js fills this with game cards -->
      <div class="poster-row" id="popularRow"></div>
    </section>

    <!-- ================= FEATURED CATEGORIES ================= -->
    <section class="section">
      <div class="section-header">
        <h2>Featured Categories</h2>
      </div>

      <!-- home.js fills this with category tiles -->
      <div class="category-row" id="categoryRow"></div>
    </section>

  </main>

  <footer class="footer">
    GameHub - a practice project. Game artwork belongs to its publishers.
  </footer>


  <!-- ================= MOBILE BOTTOM MENU ================= -->
  <nav class="bottom-nav">
    <a href="index.html" class="active"><i class="fa-solid fa-house"></i><span>Home</span></a>
    <a href="games.html"><i class="fa-solid fa-gamepad"></i><span>Games</span></a>
    <a href="#"><i class="fa-regular fa-newspaper"></i><span>News</span></a>
    <a href="profile.html"><i class="fa-regular fa-user"></i><span>Profile</span></a>
  </nav>


  <!-- Scripts: data first, then shared code, then this page's code -->
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
