<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - GameHub</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

  <main class="login-card">

    <a href="index.html" class="logo">
      <span class="logo-icon"><i class="fa-solid fa-gamepad"></i></span>
      GameHub
    </a>

    <h1 id="formTitle">Welcome Back</h1>
    <p class="subtitle" id="formSubtitle">Sign in to your account</p>

    <!-- login.js shows error messages here -->
    <p class="form-message" id="formMessage" role="alert"></p>

    <form id="loginForm" novalidate>

      <div class="form-group" id="nameField" hidden>
        <label for="name">Display name</label>
        <input type="text" id="name" class="form-input" placeholder="Your name" autocomplete="name" maxlength="60">
      </div>

      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" class="form-input" placeholder="you@example.com" autocomplete="email" maxlength="254">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" class="form-input" placeholder="At least 8 characters" autocomplete="current-password" maxlength="128">
          <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="form-row">
        <label class="remember">
          <input type="checkbox" id="remember"> Remember me
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-full" id="submitButton">Sign In</button>
    </form>

    <p class="login-footer">
      <span id="modePrompt">Don't have an account?</span>
      <a href="#register" class="text-link" id="modeToggle">Sign up</a>
    </p>

  </main>

  <script src="js/main.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
