<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - GameHub</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

  <main class="login-card">

    <a href="index.html" class="logo">
      <span class="logo-icon"><i class="fa-solid fa-gamepad"></i></span>
      GameHub
    </a>

    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to your account</p>

    <!-- login.js shows error messages here -->
    <p class="form-message" id="formMessage" role="alert"></p>

    <form id="loginForm" novalidate>

      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" class="form-input" placeholder="you@example.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" class="form-input" placeholder="Enter your password" autocomplete="current-password">
          <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="form-row">
        <label class="remember">
          <input type="checkbox" id="remember"> Remember me
        </label>
        <a href="#" class="text-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-full">Sign In</button>
    </form>

    <div class="divider">or</div>

    <div class="social-row">
      <button type="button" class="social-btn" aria-label="Sign in with Google"><i class="fa-brands fa-google"></i></button>
      <button type="button" class="social-btn" aria-label="Sign in with Facebook"><i class="fa-brands fa-facebook-f"></i></button>
      <button type="button" class="social-btn" aria-label="Sign in with Xbox"><i class="fa-brands fa-xbox"></i></button>
    </div>

    <p class="login-footer">
      Don't have an account? <a href="#" class="text-link">Sign up</a>
    </p>

  </main>

  <script src="js/main.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
